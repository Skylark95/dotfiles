- defaults:
    link:
      create: true
      relink: true

- shell:
  - git submodule sync --recursive
  - git submodule update --init --recursive
  - command: '[ "$(getent passwd "$USER" | cut -d: -f7)" = "$(command -v zsh)" ] || chsh -s "$(command -v zsh)"'
    description: Setting zsh as the default shell
    stdin: true
    stderr: true

- clean: ['~', '~/.config']

- link:
    ~/.alias:
    ~/.completions:
    ~/.env:
    ~/.functions:
    ~/.config/gitui:
    ~/.config/nvim:
    ~/.editorconfig:
    ~/.gitconfig:
    ~/.spaceshiprc.zsh:
    ~/.tigrc:
    ~/.tmux.conf:
      path: tmux_plugins/oh-my-tmux/.tmux.conf
    ~/.tmux.conf.local:
      path: tmux.conf.local
    ~/.tmux/plugins/tpm:
      path: tmux_plugins/tpm
    ~/.vimrc:
    ~/.vim_runtime:
    ~/.vim_runtime/my_configs.vim:
      path: my_configs.vim
    ~/.vim_runtime/my_plugins:
      path: vim_plugins
    ~/.zgenom:
    ~/.zshrc:
    ~/.zprofile:
